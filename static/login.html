<!-- static/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TeamWisp — Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Inter font (matches Next default often) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN + light config to set Inter -->
  <script>
    window.tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "Segoe UI", "Roboto", "Helvetica", "Arial", "Apple Color Emoji", "Segoe UI Emoji"]
            }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>

  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans antialiased flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md p-6 space-y-5">
    <div class="space-y-1 text-center">
      <h1 class="text-xl font-semibold tracking-tight">Sign in</h1>
      <p class="text-sm text-neutral-400">Welcome back to TeamWisp</p>
    </div>

    <div class="space-y-3">
      <input id="email" type="email" placeholder="you@work.com"
        class="w-full px-3 py-2 bg-neutral-900 rounded-lg text-neutral-100 placeholder-neutral-500 border border-neutral-800 focus:outline-none focus:ring-2 focus:ring-neutral-200/40" />

      <input id="password" type="password" placeholder="Password"
        class="w-full px-3 py-2 bg-neutral-900 rounded-lg text-neutral-100 placeholder-neutral-500 border border-neutral-800 focus:outline-none focus:ring-2 focus:ring-neutral-200/40" />

      <button id="login"
        class="w-full mt-2 bg-neutral-100 text-neutral-900 font-medium py-2 rounded-lg hover:bg-white transition">
        Continue
      </button>

      <div id="feedback" class="text-sm text-center mt-2 text-red-400 hidden"></div>
    </div>
  </div>

  <script src="/static/login.js"></script>
</body>

</html>
